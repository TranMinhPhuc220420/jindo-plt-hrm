name: CI / Deploy

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Nightly MySQL parity suite (UTC).
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.4"
          tools: composer:v2
          extensions: mbstring, pdo_sqlite, sqlite3, gd
          coverage: pcov

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"
          cache: npm

      - name: Prepare environment
        run: cp .env.example .env

      - name: Install dependencies and build
        run: |
          composer install --prefer-dist --no-interaction
          npm ci
          npm run build

      - name: Generate app key
        run: php artisan key:generate

      # Lint / types / Pest with coverage floor (see docs/08-development/COVERAGE_BASELINE.md).
      - name: Run CI Checks
        run: |
          npm run lint:check
          npm run format:check
          npm run types:check
          npm run test:unit
          vendor/bin/pint --parallel --test
          vendor/bin/phpstan analyse --memory-limit=1G
          php artisan config:clear --ansi
          php artisan test --coverage --min=40

  e2e:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.4"
          tools: composer:v2
          extensions: mbstring, pdo_sqlite, sqlite3, gd
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"
          cache: npm

      - name: Prepare environment
        run: cp .env.example .env

      - name: Install dependencies and build
        run: |
          composer install --prefer-dist --no-interaction
          npm ci
          npx playwright install --with-deps chromium
          npm run build

      - name: Generate app key
        run: php artisan key:generate

      - name: Run Playwright smoke
        run: npm run test:e2e:ci
        env:
          CI: true

  mysql-parity:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: hrm_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -psecret"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.4"
          tools: composer:v2
          extensions: mbstring, pdo_mysql, gd
          coverage: none

      - name: Prepare environment
        run: |
          cp .env.example .env
          composer install --prefer-dist --no-interaction
          php artisan key:generate

      - name: Run Pest on MySQL
        run: |
          php artisan config:clear --ansi
          php artisan test --configuration=phpunit.mysql.xml

  deploy:
    needs: [ci, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.4"
          tools: composer:v2
          extensions: mbstring, pdo_mysql, gd
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies and build
        run: |
          composer install --no-dev --optimize-autoloader
          npm ci
          npm run build

      # Same pattern as vsport-3: zip the release, FTP only the zip.
      # Extract manually in cPanel File Manager after upload.
      - name: Create deploy.zip
        run: |
          rm -rf .git .github tests node_modules e2e
          rm -rf storage/logs/*
          if [ -f htaccess ]; then
            mv htaccess .htaccess
          fi
          mkdir -p deploy-bundle
          zip -r deploy-bundle/deploy.zip . -x "deploy-bundle/*"

      - name: Upload deploy.zip via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./deploy-bundle/
          server-dir: /
