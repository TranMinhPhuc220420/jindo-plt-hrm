name: Build cPanel release zip

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Prepare environment
        run: |
          cp .env.example .env

      - name: Install dependencies and build
        run: |
          composer install --prefer-dist --no-interaction
          npm ci
          npm run build

      - name: Generate app key
        run: php artisan key:generate

      # Runs lint:check, format:check, types:check (ESLint/Prettier/tsc + Pint/PHPStan) and the Pest suite.
      - name: Run full CI check
        run: composer ci:check

  package:
    needs: [test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_mysql
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install production dependencies and build assets
        run: |
          composer install --no-dev --optimize-autoloader --prefer-dist --no-interaction
          npm ci
          npm run build

      - name: Prepare release directory
        run: |
          mkdir -p release
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='e2e' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='storage/logs/*' \
            --exclude='storage/framework/cache/data/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            --exclude='database/*.sqlite' \
            --exclude='release' \
            --exclude='*.zip' \
            ./ release/

          # cPanel document root expects .htaccess
          if [ -f release/htaccess ]; then
            mv release/htaccess release/.htaccess
          fi

          # Keep empty storage dirs in the zip
          mkdir -p \
            release/storage/logs \
            release/storage/framework/cache/data \
            release/storage/framework/sessions \
            release/storage/framework/views \
            release/bootstrap/cache
          touch \
            release/storage/logs/.gitkeep \
            release/storage/framework/cache/data/.gitkeep \
            release/storage/framework/sessions/.gitkeep \
            release/storage/framework/views/.gitkeep \
            release/bootstrap/cache/.gitkeep

      - name: Create zip archive
        run: |
          VERSION="${GITHUB_SHA::7}"
          ZIP_NAME="jindo-plt-hrm-${VERSION}.zip"
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"
          cd release
          zip -r "../${ZIP_NAME}" . -q
          cd ..
          ls -lh "${ZIP_NAME}"

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: cpanel-release-zip
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error
          retention-days: 14
