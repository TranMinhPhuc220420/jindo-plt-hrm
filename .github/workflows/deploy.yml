name: Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Prepare environment
        run: |
          cp .env.example .env

      - name: Install dependencies and build
        run: |
          composer install --prefer-dist --no-interaction
          npm ci
          npm run build

      - name: Generate app key
        run: php artisan key:generate

      # Runs lint:check, format:check, types:check (ESLint/Prettier/tsc + Pint/PHPStan) and the Pest suite.
      # Requires no secrets beyond what's already in .env.example (SQLite test DB).
      - name: Run full CI check
        run: composer ci:check

  deploy:
    needs: [test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_mysql
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies and build
        run: |
          composer install --no-dev --optimize-autoloader
          npm ci
          npm run build

      # Same pattern as vsport-3: zip the release, FTP only the zip.
      # Extract manually in cPanel File Manager after upload.
      - name: Create deploy.zip
        run: |
          rm -rf .git .github tests node_modules
          rm -rf storage/logs/*
          if [ -f htaccess ]; then
            mv htaccess .htaccess
          fi
          mkdir -p deploy-bundle
          zip -r deploy-bundle/deploy.zip . -x "deploy-bundle/*"

      - name: Upload deploy.zip via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./deploy-bundle/
          server-dir: /
